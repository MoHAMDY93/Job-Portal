spring.application.name=jobPortal

# logging
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
#logging.level.root=${LOG_LEVEL:INFO}
#logging.level.com.hamdy.jobPortal.company.controller.LoggingController=${LOG_LEVEL:TRACE}
logging.level.com.hamdy=${LOG_LEVEL:INFO}
logging.group.jobportal_error=com.hamdy.jobPortal.security,com.hamdy.jobPortal.contact
logging.level.jobportalerror=${LOG_LEVEL:ERROR}
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

#logging.file.name=logs/jobportal.log
#logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}

## Batching
spring.jpa.properties.hibernate.default_batch_fetch_size=50

## h2 init
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:3306/${DATABASE_NAME:jobportal}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
#spring.datasource.driver-class-name=org.h2.Driver
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.stop.command=down

